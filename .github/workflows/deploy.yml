# Build wordle-luck and put it live at https://luck.ramakocherlakota.net/.
#
# The work itself is `infra/deploy.sh`, unchanged and still the thing to run by
# hand — this only arranges for it to run on a clean checkout with credentials.
# Setting up the AWS side is documented under "Deploying from GitHub Actions" in
# README.md; without it the deploy job stops at the guard step below.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time. A queued run waits rather than cancelling the one in
# flight: a deploy that stops between the S3 upload and the CloudFront
# invalidation leaves the site serving a mix of two builds.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Nothing ships that a pull request would not have been allowed to merge.
  check:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      # Lets the runner mint the OIDC token that AWS trades for role credentials.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Without this the run would fail several steps later inside the AWS SDK,
      # with an error about the credential chain rather than about the setup
      # step that was actually missed.
      #
      # "Not set" has more than one cause and they are not distinguishable from
      # the empty string, so ask the other question too: Settings → Secrets and
      # variables → Actions has a Secrets tab and a Variables tab, and a value
      # entered under the wrong one is silently invisible to the other. Knowing
      # which of the two happened is the difference between a five-second fix
      # and a hunt.
      - name: Check the deploy role is configured
        env:
          ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          # The comparison, not the value: a boolean is not a secret, so this
          # neither leaks the ARN nor trips the log masker.
          SET_AS_SECRET: ${{ secrets.AWS_DEPLOY_ROLE_ARN != '' }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            if [ "$SET_AS_SECRET" = "true" ]; then
              echo "::error::AWS_DEPLOY_ROLE_ARN is set as a *secret*, but this workflow reads it as a *variable*. Re-add it under Settings → Secrets and variables → Actions → the Variables tab, and delete the secret."
            else
              echo "::error::AWS_DEPLOY_ROLE_ARN is set as neither a repository variable nor a secret. Add it under Settings → Secrets and variables → Actions → the Variables tab (an environment-scoped variable will not do: this job declares no environment). See 'Deploying from GitHub Actions' in README.md."
            fi
            exit 1
          fi
          # A malformed ARN is not obviously different from a good one by eye —
          # a single stray space inside it is enough. STS calls that "Request
          # ARN is invalid", and configure-aws-credentials treats it as a
          # transient fault and retries it twelve times over 83 seconds before
          # failing, without ever printing the value it was given. Check the
          # shape here instead, where it can be shown.
          if [[ ! "$ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/[^[:space:]]+$ ]]; then
            echo "::error::AWS_DEPLOY_ROLE_ARN is not a well-formed role ARN: '$ROLE_ARN'. Expected arn:aws:iam::<12-digit account id>:role/<name>, with no spaces. Fix it under Settings → Secrets and variables → Actions → the Variables tab."
            exit 1
          fi
          echo "Deploying as $ROLE_ARN"

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: wordle-luck-deploy
          # CloudFront's certificate has to live here, and the rest of the stack
          # is here with it.
          aws-region: us-east-1

      # AWS answers a trust-policy mismatch with "Not authorized to perform
      # sts:AssumeRoleWithWebIdentity" and nothing else — not which condition
      # failed, not what identity was presented, and the same words if the role
      # is not there at all. The whole decision turns on claims in a token that
      # never appears in the log, so a mismatch is invisible from this side.
      #
      # So on failure, ask for the same token again and print the three claims
      # the policy matches on, to compare against the role's trust policy:
      #
      #   aws iam get-role --role-name wordle-luck-deploy \
      #     --query Role.AssumeRolePolicyDocument
      #
      # The claims only. The token is a bearer credential for this job and is
      # never printed.
      #
      # The two ACTIONS_ID_TOKEN_REQUEST_* variables are read straight from the
      # shell. They are process environment variables the runner sets on the
      # job, and the `env` expression context holds only what an `env:` block
      # put there — so `${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}` is the empty
      # string, and this step quietly reported having nothing to show.
      - name: Show the identity AWS rejected
        if: failure()
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] ||
             [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "No OIDC token endpoint in this job; nothing to show."
            exit 0
          fi
          jwt="$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | jq -r '.value // empty')"
          if [ -z "$jwt" ]; then
            echo "Could not mint an OIDC token to inspect."
            exit 0
          fi
          # Middle segment of the JWT, base64url-decoded. Re-pad to a multiple
          # of four, which base64url omits and base64(1) insists on.
          body="$(printf '%s' "$jwt" | cut -d. -f2 | tr '_-' '/+')"
          while [ $(( ${#body} % 4 )) -ne 0 ]; do body="${body}="; done
          echo "The token this job presented to AWS claimed:"
          printf '%s' "$body" | base64 -d \
            | jq '{sub, aud, repository, ref, workflow_ref}'
          echo
          echo "The role's trust policy must allow exactly that sub and aud."

      # Deploys the stack, builds, uploads to S3, invalidates CloudFront, and
      # prints the site URL.
      - run: ./infra/deploy.sh
