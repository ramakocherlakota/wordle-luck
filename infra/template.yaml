AWSTemplateFormatVersion: '2010-09-09'
Description: >
  wordle-luck static site: private S3 bucket behind CloudFront (OAC), with the
  wordle-svc Lambda Function URL attached as a second origin under /service* so
  the browser stays same-origin and needs no CORS.

Parameters:

  DomainName:
    Type: String
    Default: luck.ramakocherlakota.net

  HostedZoneId:
    Type: String
    Default: Z7AC1UOEPTHKG
    Description: Hosted zone for ramakocherlakota.net.

  SiteBucketName:
    Type: String
    Default: wordle-luck-site
    Description: >
      Must not contain dots. The OAC origin is <bucket>.s3.<region>.amazonaws.com,
      and a dotted bucket name would not match the *.s3.<region>.amazonaws.com
      certificate, breaking the CloudFront-to-S3 TLS handshake.

  ApiOriginDomain:
    Type: String
    Default: kxk4tebf2oubdbadxazw5uuvma0dvfpe.lambda-url.us-east-1.on.aws
    Description: >
      Host of the wordle-pal-svc (prod) Lambda Function URL. Its AuthType stays
      NONE so wordle-pal keeps calling it directly; this stack only adds a second
      route to it and changes nothing about the function itself.

  ApiReadTimeoutSeconds:
    Type: Number
    Default: 60
    MinValue: 1
    MaxValue: 60
    Description: >
      CloudFront caps this at 60s (180s only via a service quota increase). Fine
      for the rate_solution/remaining_answers calls this app makes, which return
      in a few seconds. wordle-pal's long-running guess/solve operations are why
      that app is deliberately not routed through CloudFront.

# Managed policy IDs are global constants, resolved from the CloudFront API.
Mappings:
  CloudFrontManagedPolicies:
    Cache:
      Optimized: 658327ea-f89d-4fab-a63d-7e88639e58f6
      Disabled: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
    OriginRequest:
      AllViewerExceptHostHeader: b689b0a8-53d0-40ab-baf2-68738e2966ac
    ResponseHeaders:
      SecurityHeaders: 67f7725c-6f97-4210-82d7-5512b31e9d03
  CloudFrontHostedZone:
    Global:
      Id: Z2FDTNDATAQYW2

Resources:

  SiteBucket:
    Type: AWS::S3::Bucket
    # Keep the bucket if the stack is torn down; emptying it is a deliberate act.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref SiteBucketName
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # Grants only this distribution read access; the bucket stays fully private.
  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      # CloudFormation writes the validation CNAME itself and blocks until ACM
      # issues, so the first deploy pauses here for a few minutes.
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-s3-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # The app posts to exactly "/service"; the Lambda serves its operation at the
  # origin root, so strip the prefix on the way through.
  ServiceRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-strip-service-prefix'
      AutoPublish: true
      FunctionConfig:
        Comment: Rewrite /service and /service/* to the origin root.
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri.replace(/^\/service/, '');
          request.uri = uri === '' ? '/' : uri;
          return request;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: wordle-luck
        Aliases:
          - !Ref DomainName
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021

        Origins:
          - Id: s3-site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: lambda-api
            DomainName: !Ref ApiOriginDomain
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
              OriginReadTimeout: !Ref ApiReadTimeoutSeconds
              OriginKeepaliveTimeout: 60

        DefaultCacheBehavior:
          TargetOriginId: s3-site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          CachePolicyId: !FindInMap [CloudFrontManagedPolicies, Cache, Optimized]
          ResponseHeadersPolicyId: !FindInMap [CloudFrontManagedPolicies, ResponseHeaders, SecurityHeaders]

        CacheBehaviors:
          # "/service*" (not "/service/*") so it matches the bare "/service" the
          # client actually posts to, as well as any future sub-path.
          - PathPattern: /service*
            TargetOriginId: lambda-api
            ViewerProtocolPolicy: https-only
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
            CachePolicyId: !FindInMap [CloudFrontManagedPolicies, Cache, Disabled]
            # Forwards everything except Host, which must stay the Lambda's own.
            OriginRequestPolicyId: !FindInMap [CloudFrontManagedPolicies, OriginRequest, AllViewerExceptHostHeader]
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt ServiceRewriteFunction.FunctionARN

        # A private OAC bucket answers 403 for a missing key, so both codes map
        # to the app shell. Note these apply distribution-wide: a 403/404 from
        # the API would also render as index.html. wordle-svc only returns
        # 200/500, and the client fails JSON parsing into its normal error path.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0

  DnsRecordA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: !FindInMap [CloudFrontHostedZone, Global, Id]
        EvaluateTargetHealth: false

  DnsRecordAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: !FindInMap [CloudFrontHostedZone, Global, Id]
        EvaluateTargetHealth: false

Outputs:

  SiteUrl:
    Value: !Sub 'https://${DomainName}/'

  SiteBucket:
    Value: !Ref SiteBucket
    Description: Upload target for the built assets.

  DistributionId:
    Value: !Ref Distribution
    Description: Invalidation target after each upload.

  DistributionDomain:
    Value: !GetAtt Distribution.DomainName
